# clipse's pinned main build exits fatally when clipboard_history.json is
# missing (its disk-space check stats the absent file before its logger is up),
# so seed an empty history once; "f" never overwrites an existing file.
d %h/.config/clipse 0755 - - -
f %h/.config/clipse/clipboard_history.json 0644 - - - {"clipboardHistory": []}
